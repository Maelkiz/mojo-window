[workspace]
authors = ["Karl Theodor Ruby <karl.ruby@tuta.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo-window"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
example = "mojo run -I src examples/basic_window.mojo"
example_gl = "mojo run -I src examples/gl_triangle.mojo"
test = "bash -c 'set -e; for f in tests/test_*.mojo; do SDL_VIDEODRIVER=dummy mojo run -I src \"$f\"; done'"

[dependencies]
mojo = "*"
sdl3 = "*"
